<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS DevOps Assignment</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1b29;
            color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1a2735;
            border: 1px solid #232f3e;
            border-top: 5px solid #ff9900;
            border-radius: 12px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #ffffff;
            font-size: 1.6rem;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #232f3e;
        }
        .info-group {
            margin-bottom: 16px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .info-label {
            color: #9ba7b6;
            font-weight: 600;
            display: inline-block;
            width: 150px;
        }
        .info-value {
            color: #ffffff;
            font-weight: 500;
        }
        .repo-link {
            color: #ff9900;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s ease;
        }
        .repo-link:hover {
            color: #ffac33;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to AWS DevOps Assignment</h1>
        
        <div class="info-group">
            <span class="info-label">Student Name:</span>
            <span class="info-value">Dennis W.</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Role:</span>
            <span class="info-value">Junior DevOps Engineer</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Module:</span>
            <span class="info-value">AWS Cloud Foundations</span>
        </div>
        
        <div class="info-group" style="margin-top: 20px;">
            <span class="info-label" style="display: block; margin-bottom: 6px;">GitHub Repository:</span>
            <a href="https://github.com/DW100-ops/aws-devops-assignment" class="repo-link" target="_blank">
                https://github.com/DW100-ops/aws-devops-assignment
            </a>
        </div>
    </div>
</body>
</html>
